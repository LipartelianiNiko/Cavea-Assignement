<div class="container mt-5">

  <div class="card shadow-sm p-4 mx-auto" style="max-width:500px;">

    <h3 class="mb-4 text-center">
      Add Item
    </h3>


    <div class="mb-3">

      <label class="form-label">
        Item Name
      </label>

      <input
        class="form-control"
        type="text"
        [(ngModel)]="name"
        name="name"
        required
        placeholder="Enter Item Name">

    </div>


    <div class="mb-3">

      <label class="form-label">
        Price
      </label>

      <input
        class="form-control"
        type="number"
        [(ngModel)]="price"
        name="price"
        required
        placeholder="Enter Item Price">

    </div>


    <div class="mb-4">

      <label class="form-label">
        Location
      </label>

      <select
        class="form-select"
        [(ngModel)]="locationId"
        name="locationId"
        required>

        <option [ngValue]="undefined">
          Select Location
        </option>

        @for(location of locations; track location.id) {

          <option [ngValue]="location.id">

            {{ location.name }}

          </option>

        }

      </select>

    </div>


    <div class="d-flex justify-content-between">

      <button
        class="btn btn-primary"
        type="submit"
        (click)="createItem()">

        Create

      </button>


      <button
        class="btn btn-secondary"
        (click)="goBack()">

        ← Back

      </button>

    </div>

  </div>

</div>
